<div class="mt-3 py-3" *ngIf="users?.length">
    <!--<span class="label"><i style="color: grey">Displaying {{startingItem}}-{{endingItem}} of {{totalElements}}
    Users</i></span>-->
  <table class="table table-hover">
    <thead>
    <th>Nickname</th>
    <th>Email</th>
    <th>Status</th>
    </thead>
    <tbody>
    <tr *ngFor="let user of users |
              paginate
              : {
                  itemsPerPage: userPagedDto.pageSize,
                  currentPage: currentPage,
                  totalItems: userPagedDto.totalElements
                };">
      <td>{{user.nickname}}</td>
      <td>{{user.email}}</td>
      <td *ngIf="user.isLocked">Locked</td>
      <td *ngIf="!user.isLocked">Unlocked</td>
      <td *ngIf="user.isLocked" style="width:10%">
        <button class="btn btn-outline-dark" (click)="changeLockStatus(user.id)"
                data-toggle="tooltip" title="Unlock user">
          <i class="bi bi-unlock"></i>
        </button>
      </td>
      <td *ngIf="!user.isLocked" style="width:10%">
        <button class="btn btn-outline-dark" (click)="changeLockStatus(user.id)"
                data-toggle="tooltip" title="Lock user">
          <i class="bi bi-lock"></i>
        </button>
      </td>
      <!--<td style="width:10%">
          <button class="btn btn-outline-dark" (click)="resetPassword(user.id)"
                  data-toggle="tooltip" title="Reset user password">
          <i class="bi bi-recycle"></i>
        </button>
      </td>-->

      </tr>
      </tbody>
    </table>
