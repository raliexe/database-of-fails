<div>
  <div class="row">

    <!-- Back Button -->
    <div class="col-1 mx-auto">
      <button class="btn btn-dark" (click)="goBack()" routerLinkActive="active"
              style="position: fixed; left: 135px; top: 150px; border-radius: 10px;">
        <i class="bi bi-arrow-left"></i>
      </button>
    </div>

    <div class="col-8 mx-auto px-5 rounded-4">

      <span class="anchor" id="formEdit"></span>
      <h3 class="pt-4 pb-4">Edit Fail</h3>

      <form class="form-horizontal" [formGroup]="editForm" (ngSubmit)="updateFail()">

        <!-- Name -->
        <div class="form-group" class="padding1">
          <label for="inputName" class="justify-left-1">
            <b style="color: red">*</b>Name:
          </label>
          <div>
            <input type="text" id="inputName" name="name" formControlName="name" class="form-control"
                   aria-describedby="nameHelp" style="width: 70%;" required>
          </div>
        </div>
        <div *ngIf="editForm.controls['name'].touched && editForm.controls['name'].errors"
             class="error mb-2" class="justify-left-1" class="padding0">
          <small class="form-text text-danger" *ngIf="editForm.controls['name'].errors['required']">
            Name is required!
          </small>
          <small class="form-text text-danger" *ngIf="editForm.controls['name'].errors?.['maxlength']">
            Name is too long!
          </small>
        </div>

        <!-- Description -->
        <div class="form-group" class="padding1">
          <label for="inputDescription" class="justify-left-1">
            <b style="color: red">*</b>Description:
          </label>
          <div>
          <textarea rows="10" id="inputDescription" name="description" formControlName="description"
                    class="form-control"
                    aria-describedby="descriptionHelp" style="width: 100%;" required></textarea>
          </div>
        </div>
        <div *ngIf="editForm.controls['description'].touched && editForm.controls['description'].errors"
             class="error mb-2" class="justify-left-1" class="padding0">
          <small class="form-text text-danger" *ngIf="editForm.controls['description'].errors['required']">
            Description is required!
          </small>
          <small class="form-text text-danger" *ngIf="editForm.controls['description'].errors?.['maxlength']">
            Description is too long!
          </small>
        </div>

        <!-- Date -->
        <div class="form-group" class="padding1">
          <label for="inputDate" class="justify-left-1">
            <b style="color: red">*</b>Date:
          </label>
          <div>
            <input type="date" id="inputDate" name="date" formControlName="date" class="form-control"
                   style="width: 40%;" required>
          </div>
        </div>
        <div *ngIf="editForm.controls['date'].touched && editForm.controls['date'].errors"
             class="error mb-2" class="justify-left-1" class="padding0">
          <small class="form-text text-danger" *ngIf="editForm.controls['date'].errors['required']">
            Date is required!
          </small>
        </div>

        <!-- Image -->
        <div class="form-group" class="padding1">
          <label for="inputImage" class="justify-left-1">
            Select main image:
          </label>
          <div>
            <input #inputImage type="file" id="inputImage" name="image" formControlName="image"
                   class="form-control" accept="image/*" style="width: 40%;"
                   (change)="onImageUpload($event)">
            <ng-container>
              <div *ngIf="imageContent" class="card mt-3" style="max-width: 160px;">
                <div class="card-header">
                  <img [src]="imageContent" alt="Image" class="center-image"/>
                </div>
                <div class="file-name">{{ transformImageName(imageName) }}</div>
              </div>
              <div *ngIf="imageUpload && imageUpload.size > 1048575" class="justify-left">
                <small class="form-text text-danger">
                  Image size must be under 1 MB!
                </small>
              </div>
            </ng-container>
          </div>
        </div>

        <!-- Child Images -->
        <div class="form-group" class="padding1">
          <label for="inputChildImages" class="justify-left-1">
            Select images:
          </label>
          <div>
            <input type="file" id="inputChildImages" name="childImage" formControlName="childImage"
                   class="form-control" multiple="true"
                   accept="image/*" style="width: 40%;" (change)="onChildImageUpload($event)">
            <div class="image-container">
              <ng-container *ngFor="let img of imagesUpload">
                <div>
                  <div *ngIf="img.status == 'ACTIVE'" class="card mt-3"
                       style="margin: 0 15px 0 0">
                    <button class="btn btn-light btn-outline-dark float-right smaller-button"
                            (click)="markForRemove(img)"
                            style="position: absolute; top: 10px; right: 10px; border-radius: 10px;">
                      <i class="bi bi-x-lg"></i>
                    </button>
                    <div class="card-header">
                      <img [src]="img.content" alt="Image" class="center-image"/>
                    </div>
                    <p class="file-name">{{ transformImageName(img.name) }}</p>
                  </div>
                  <div *ngIf="img.status == 'ACTIVE' && img.size > 1048575" class="justify-left">
                    <small class="form-text text-danger" style="width: 160px;">
                      Image size must be under 1 MB!
                    </small>
                  </div>
                </div>
              </ng-container>
            </div>
          </div>
        </div>

        <!-- Add/Cancel Buttons -->
        <div class="pt-4 pb-4 justify-center">
          <button type="button" [disabled]="editForm.invalid || hasInvalidImage()"
                  class="btn btn-success" style="height: 44px; width:54px; margin-right: 15px"
                  (click)="updateFail()">
            <i class="bi bi-check2 icon-21"></i>
          </button>
        </div>

      </form>

    </div>

    <div class="col-1 mx-auto">
    </div>

  </div>
</div>
