<div>
  <div class="row">
    <!-- Back Button -->
    <div class="col-1 mx-auto">
      <button class="btn btn-dark" (click)="goBack()" routerLinkActive="active"
              style="position: fixed; left: 135px; top: 150px; border-radius: 10px;">
        <i class="bi bi-arrow-left"></i>
      </button>
    </div>

    <div class="col-8 mx-auto px-5 rounded-4">
      <span class="anchor" id="formRegistration"></span>
      <h3 class="pt-4 pb-4">Add User</h3>

        <form class="form" [formGroup]="registerForm" (ngSubmit)="registerUser()">
          <div class="form-group padding1">
            <label for="inputNickname" class="label"><b style="color: red">*</b>Nickname</label>
            <input type="text" id="inputNickname" name="nickname" formControlName="nickname"
                   class="form-control" aria-describedby="nicknameHelp" required>
          </div>
          <div *ngIf="registerForm.controls.nickname.touched && registerForm.controls.nickname.errors"
               class="error mb-2 padding0">
            <small class="form-text text-danger label" *ngIf="registerForm.controls.nickname.errors.required">
              Nickname is required!
            </small>
            <small class="form-text text-danger label" *ngIf="registerForm.controls.nickname.errors?.['minlength']">
              Nickname is too short!
            </small>
            <small class="form-text text-danger label" *ngIf="registerForm.controls.nickname.errors?.['maxlength']">
              Nickname is too long!
            </small>
          </div>

          <div class="form-group padding1">
            <label for="inputEmail" class="label"><b style="color: red">*</b>Email</label>
            <input type="text" id="inputEmail" name="email" formControlName="email"
                   class="form-control" aria-describedby="emailHelp"
                   pattern="^([a-zA-Z0-9_\-\.]+)@([a-zA-Z0-9_\-\.]+)\.([a-zA-Z]{2,5})$" required>
          </div>
          <div *ngIf="registerForm.controls.email.touched && registerForm.controls.email.errors"
               class="error mb-2 padding0">
            <!--<small class="form-text text-danger label" *ngIf="registerForm.controls.email.errors.required">
              Email is required!
            </small>-->
            <small class="form-text text-danger label" *ngIf="registerForm.controls.email.errors?.pattern">
              Invalid email!
            </small>
          </div>

          <div class="form-group padding1">
            <label for="password" class="label"><b style="color: red">*</b>Password</label>
            <input type="password" id="password" name="password" formControlName="password" class="form-control">
          </div>
          <div *ngIf="registerForm.controls.password.touched && registerForm.controls.password.errors"
               class="error mb-2 padding0">
            <!--<small class="form-text text-danger label" *ngIf="registerForm.controls.password.errors.required">
              Password is required!
            </small>-->
            <small class="form-text text-danger label" *ngIf="registerForm.controls.password.errors?.['minlength']">
              Password must be at least 8 symbols!
            </small>
          </div>

          <div class="form-group padding1">
            <label class="label"><b style="color: red">*</b>Role</label>
            <ng-select id="inputAdmin" name="admin" [searchable]="false" formControlName="admin"
                       placeholder="Select role" required>
              <ng-option [value]="true">Administrator</ng-option>
              <ng-option [value]="false">User</ng-option>
            </ng-select>
          </div>

          <div class="pt-4 pb-4" style="display: flex; justify-content: center;">
            <button type="button" [disabled]="registerForm.invalid"
                    class="btn btn-success" style="height: 44px; width:54px;"
                    (click)="registerUser()">
              <i class="bi bi-check2 icon-size"></i>
            </button>
          </div>
        </form>

    </div>

    <div class="col-1 mx-auto">
    </div>

  </div>
</div>
